[project]
name = "dl-sandbox"
version = "0.1.0"
description = "Deep learning sandbox: neural nets, autograd, and classifiers built from scratch with NumPy"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "colorama>=0.4.6",
    "datasets>=5.0.1",
    "graphviz>=0.21",
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "regex>=2024.0.0",
    "seaborn>=0.13.2",
    "sentencepiece>=0.2.0",
    "tiktoken>=0.8.0",
    "torch>=2.10.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = ["pytest>=8"]
